name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

jobs:
  test-and-screenshot:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: expense_tracker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring
          tools: composer

      - name: Install Composer Dependencies (PHPUnit)
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit Backend Tests
        run: vendor/bin/phpunit --configuration phpunit.xml

      - name: Start PHP Built-in Server
        run: |
          # Start server in the background using the custom routing script
          php -S 127.0.0.1:8080 server.php &
          # Give it a second to start
          sleep 2
          
      - name: Run Dynamic SaaS Installer (Zero-Config DB Setup & Seeding)
        run: |
          OUTPUT=$(curl -s -X POST http://127.0.0.1:8080/setup.php \
            -d "db_host=127.0.0.1" \
            -d "db_name=expense_tracker" \
            -d "db_user=root" \
            -d "db_pass=root" \
            -d "admin_name=CI Super Admin" \
            -d "admin_email=admin@ci.com" \
            -d "admin_pass=admin123" \
            -d "site_name=Daily Expense Tracker Pro" \
            -d "currency=$" \
            -d "timezone=UTC" \
            -d "brand_color=#0d6efd" \
            -d "expense_cats=Food,Transport,Utilities" \
            -d "income_cats=Salary,Freelance")
          if [[ "$OUTPUT" != *"Setup Complete!"* ]]; then
            echo "Installer failed! Output: $OUTPUT"
            exit 1
          fi
          echo "Installer succeeded."
            
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y
          npm install -D @playwright/test
          npx playwright install --with-deps

      - name: Run Playwright E2E UI Tests & Capture Screenshots
        run: |
          npx playwright test tests/e2e/screenshot.spec.js

      - name: Upload Screenshots as Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: screenshots/
          retention-days: 14
